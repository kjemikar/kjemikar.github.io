<!DOCTYPE html>
<html lang="nn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3 Telefonhotellgenerator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            background-color: #0076ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #5a6268;
        }
        #preview {
            margin-top: 20px;
            border: 1px solid #ddd;
            background: #fff;
            max-width: 100%;
            height: auto;
        }
        .actions {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>A3 Telefonhotellgenerator</h2>
    <p>Skriv inn elevnamn (maks 10 stk., 1 per line). Sida genererer eit liggjande A3-ark med 10 plassar, med tilhøyrande namn, til telefonar. Hugs å velgje A3 som storleik når du skriv ut. Ingenting vert lagra på sida, men eg tilrår jamvel å nytte berre førenamn.</p>
    
    <textarea id="studentNames" placeholder="John Doe&#10;Jane Smith&#10;Alex Jones..."></textarea>
    
    <div>
        <button onclick="generateGrid()">Generer Hotell</button>
        <button class="secondary" id="downloadBtn" onclick="downloadSVG()" style="display:none;">Last ned SVG</button>
        <button class="secondary" id="printBtn" onclick="printSVG()" style="display:none;">Skriv ut ark</button>
    </div>

    <div class="actions">
        <div id="svgContainer"></div>
    </div>
</div>

<script>
    // A3 Landscape Dimensions in mm
    const A3_WIDTH = 420;
    const A3_HEIGHT = 297;
    
    const COLS = 5;
    const ROWS = 2;
    
    const CELL_WIDTH = A3_WIDTH / COLS;
    const CELL_HEIGHT = A3_HEIGHT / ROWS;

    function generateGrid() {
        const text = document.getElementById('studentNames').value;
        const names = text.split('\n').map(name => name.trim()).filter(name => name.length > 0);
        
        let svgContent = `<svg id="preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${A3_WIDTH} ${A3_HEIGHT}" width="${A3_WIDTH}mm" height="${A3_HEIGHT}mm">`;
        
        // 1. Draw the single horizontal dividing line right down the middle
        const midY = A3_HEIGHT / 2;
        svgContent += `<line x1="0" y1="${midY}" x2="${A3_WIDTH}" y2="${midY}" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>`;
        
        // 2. Draw the 4 internal vertical dividing lines
        for (let c = 1; c < COLS; c++) {
            const lineX = c * CELL_WIDTH;
            svgContent += `<line x1="${lineX}" y1="0" x2="${lineX}" y2="${A3_HEIGHT}" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>`;
        }

        // 3. Populate the student names in their invisible grid positions
        let nameIndex = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const studentName = names[nameIndex] || "";

                if (studentName) {
                    // Calculate exact center coordinates for the text
                    const textX = (c * CELL_WIDTH) + (CELL_WIDTH / 2);
                    const textY = (r * CELL_HEIGHT) + (CELL_HEIGHT / 2);
                    
                    svgContent += `
                        <text x="${textX}" y="${textY}" 
                              font-family="sans-serif" 
                              font-size="10" 
                              font-weight="bold"
                              fill="#333"
                              text-anchor="middle" 
                              dominant-baseline="middle">
                            ${escapeHTML(studentName)}
                        </text>`;
                }
                nameIndex++;
            }
        }

        svgContent += `</svg>`;
        
        document.getElementById('svgContainer').innerHTML = svgContent;
        document.getElementById('downloadBtn').style.display = 'inline-block';
        document.getElementById('printBtn').style.display = 'inline-block';
    }

    function downloadSVG() {
        const svgElement = document.getElementById('preview');
        if (!svgElement) return;
        
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
        const svgUrl = URL.createObjectURL(svgBlob);
        
        const downloadLink = document.createElement("a");
        downloadLink.href = svgUrl;
        downloadLink.download = "student-phone-grid.svg";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    function printSVG() {
        const svgElement = document.getElementById('preview');
        if (!svgElement) return;

        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Print Grid</title>
                <style>
                    @page { size: A3 landscape; margin: 0; }
                    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
                    svg { width: 420mm; height: 297mm; }
                </style>
            </head>
            <body>
                ${svgElement.outerHTML}
                <script>
                    window.onload = function() { window.print(); window.close(); }
                <\/script>
            </body>
            </html>
        `);
        printWindow.document.close();
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
