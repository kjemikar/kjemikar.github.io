<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3 Phone Grid Generator</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            background-color: #0076ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.secondary {
            background-color: #6c757d;
        }
        button.secondary:hover {
            background-color: #5a6268;
        }
        #preview {
            margin-top: 20px;
            border: 1px solid #ddd;
            background: #fff;
            max-width: 100%;
            height: auto;
        }
        .actions {
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>A3 Student Phone Grid Generator</h2>
    <p>Enter student names (one per line). The app will generate a Landscape A3 sheet with a 5x2 grid (10 cells total). Each cell is roughly 84mm x 148.5mm, perfect for placing a phone vertically.</p>
    
    <textarea id="studentNames" placeholder="John Doe&#10;Jane Smith&#10;Alex Jones..."></textarea>
    
    <div>
        <button onclick="generateGrid()">Generate Grid</button>
        <button class="secondary" id="downloadBtn" onclick="downloadSVG()" style="display:none;">Download SVG</button>
        <button class="secondary" id="printBtn" onclick="printSVG()" style="display:none;">Print Sheet</button>
    </div>

    <div class="actions">
        <div id="svgContainer"></div>
    </div>
</div>

<script>
    // A3 Landscape Dimensions in mm
    const A3_WIDTH = 420;
    const A3_HEIGHT = 297;
    
    // Grid Setup: 5 columns, 2 rows = 10 cells
    // (This gives vertical slots of ~84mm x 148.5mm, ideal for smartphones)
    const COLS = 5;
    const ROWS = 2;
    
    const CELL_WIDTH = A3_WIDTH / COLS;
    const CELL_HEIGHT = A3_HEIGHT / ROWS;

    function generateGrid() {
        const text = document.getElementById('studentNames').value;
        // Split by newline and filter out empty lines
        const names = text.split('\n').map(name => name.trim()).filter(name => name.length > 0);
        
        let svgContent = `<svg id="preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${A3_WIDTH} ${A3_HEIGHT}" width="${A3_WIDTH}mm" height="${A3_HEIGHT}mm">`;
        
        // Add a subtle border around the whole A3 page
        svgContent += `<rect x="0" y="0" width="${A3_WIDTH}" height="${A3_HEIGHT}" fill="none" stroke="#ccc" stroke-width="0.5"/>`;

        let nameIndex = 0;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const x = c * CELL_WIDTH;
                const y = r * CELL_HEIGHT;
                const studentName = names[nameIndex] || ""; // Leave blank if no name left

                // Draw cell boundary
                svgContent += `<rect x="${x}" y="${y}" width="${CELL_WIDTH}" height="${CELL_HEIGHT}" fill="none" stroke="#000" stroke-width="0.5" stroke-dasharray="2,2"/>`;
                
                // Add student name if it exists
                if (studentName) {
                    // Position text in the center of the cell
                    const textX = x + (CELL_WIDTH / 2);
                    const textY = y + (CELL_HEIGHT / 2);
                    
                    svgContent += `
                        <text x="${textX}" y="${textY}" 
                              font-family="sans-serif" 
                              font-size="10" 
                              font-weight="bold"
                              fill="#333"
                              text-anchor="middle" 
                              dominant-baseline="middle">
                            ${escapeHTML(studentName)}
                        </text>`;
                }
                nameIndex++;
            }
        }

        svgContent += `</svg>`;
        
        // Render to screen
        document.getElementById('svgContainer').innerHTML = svgContent;
        
        // Show utility buttons
        document.getElementById('downloadBtn').style.display = 'inline-block';
        document.getElementById('printBtn').style.display = 'inline-block';
    }

    function downloadSVG() {
        const svgElement = document.getElementById('preview');
        if (!svgElement) return;
        
        const svgData = new XMLSerializer().serializeToString(svgElement);
        const svgBlob = new Blob([svgData], {type: "image/svg+xml;charset=utf-8"});
        const svgUrl = URL.createObjectURL(svgBlob);
        
        const downloadLink = document.createElement("a");
        downloadLink.href = svgUrl;
        downloadLink.download = "student-phone-grid.svg";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }

    function printSVG() {
        const svgElement = document.getElementById('preview');
        if (!svgElement) return;

        // Open a clean print window to isolate the SVG
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Print Grid</title>
                <style>
                    @page { size: A3 landscape; margin: 0; }
                    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
                    svg { width: 420mm; height: 297mm; }
                </style>
            </head>
            <body>
                ${svgElement.outerHTML}
                <script>
                    window.onload = function() { window.print(); window.close(); }
                <\/script>
            </body>
            </html>
        `);
        printWindow.document.close();
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
